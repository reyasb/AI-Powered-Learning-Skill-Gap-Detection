version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillmap-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./skillmap.db
      - SECRET_KEY=production_secret_key_skillmap_ai_2026_super_secure
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - LLM_PROVIDER=openai
      - LLM_API_KEY=
      - LLM_MODEL=gpt-4o-mini
      - UPLOAD_DIR=./uploads
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./uploads:/app/uploads
      - ./skillmap.db:/app/skillmap.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillmap-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
